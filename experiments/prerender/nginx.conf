map $uri $csr_route {
  default 0;
  include /etc/nginx/csr-routes.map;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  rewrite ^(.+)/$ $1 permanent;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/index.html @csr;
  }

  location @csr {
    if ($csr_route) {
      rewrite ^ /spa.html last;
    }
    return 404;
  }
}
