services:
  web:
    build:
      context: ../..
      dockerfile: experiments/prerender/Dockerfile
      target: web
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      retries: 30

  dev:
    build:
      context: ../..
      dockerfile: experiments/prerender/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1s
      retries: 60

  e2e:
    build:
      context: ../..
      dockerfile: experiments/prerender/Dockerfile
      target: e2e
    environment:
      BASE_URL: http://web
      DEV_URL: http://dev:3000
      CI: "1"
    depends_on:
      web:
        condition: service_healthy
      dev:
        condition: service_healthy
    init: true
    ipc: host
