services:
  web:
    build:
      context: ../..
      dockerfile: experiments/prerender/Dockerfile
      target: web
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      retries: 30

  e2e:
    build:
      context: ../..
      dockerfile: experiments/prerender/Dockerfile
      target: e2e
    environment:
      BASE_URL: http://web
      CI: "1"
    depends_on:
      web:
        condition: service_healthy
    init: true
    ipc: host
